name: Performance CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Check bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "===================="
          
          # Get JS bundle sizes
          echo ""
          echo "JavaScript bundles (gzipped):"
          for file in build/static/js/*.js; do
            if [ -f "$file" ]; then
              gzip -k "$file"
              size=$(stat -f%z "${file}.gz" 2>/dev/null || stat -c%s "${file}.gz")
              size_kb=$((size / 1024))
              filename=$(basename "$file")
              echo "  $filename: ${size_kb}KB"
              rm "${file}.gz"
            fi
          done
          
          # Get CSS bundle sizes
          echo ""
          echo "CSS bundles (gzipped):"
          for file in build/static/css/*.css; do
            if [ -f "$file" ]; then
              gzip -k "$file"
              size=$(stat -f%z "${file}.gz" 2>/dev/null || stat -c%s "${file}.gz")
              size_kb=$((size / 1024))
              filename=$(basename "$file")
              echo "  $filename: ${size_kb}KB"
              rm "${file}.gz"
            fi
          done
          
          # Budget: measure the INITIAL-LOAD payload (asset-manifest entrypoints),
          # not the sum of every chunk. Heavy features (jspdf, html-to-image,
          # editor, charts) are lazy-loaded via dynamic import()/React.lazy and
          # download only when used, so they must not count against first paint.
          ENTRY_JS=$(node -e "const m=require('./build/asset-manifest.json'); console.log(m.entrypoints.filter(f=>f.endsWith('.js')).map(f=>f.split('/').pop()).join(' '))")
          if [ -z "$ENTRY_JS" ]; then
            echo "❌ FAIL: could not read entrypoints from asset-manifest.json"
            exit 1
          fi
          echo "Initial-load entrypoints: $ENTRY_JS"

          total_js=0
          initial_js=0
          for file in build/static/js/*.js; do
            if [ -f "$file" ]; then
              size=$(gzip -c "$file" | wc -c)
              total_js=$((total_js + size))
              filename=$(basename "$file")
              case " $ENTRY_JS " in
                *" $filename "*) initial_js=$((initial_js + size)) ;;
              esac
            fi
          done
          initial_js_kb=$((initial_js / 1024))
          total_js_kb=$((total_js / 1024))

          echo ""
          echo "Initial-load JS (gzipped): ${initial_js_kb}KB  [budget 300KB]"
          echo "Total JS incl. on-demand (gzipped): ${total_js_kb}KB  [ceiling 550KB]"

          # First-paint budget: only the entrypoint bundle blocks initial render.
          status=0
          if [ "$initial_js_kb" -gt 300 ]; then
            echo "❌ FAIL: initial-load JS exceeds 300KB budget!"
            status=1
          else
            echo "✅ PASS: initial-load JS within 300KB budget"
          fi
          # Safety ceiling so total precached JS can't grow unbounded.
          if [ "$total_js_kb" -gt 550 ]; then
            echo "❌ FAIL: total JS exceeds 550KB ceiling!"
            status=1
          else
            echo "✅ PASS: total JS within 550KB ceiling"
          fi
          exit $status

  performance-tests:
    name: Performance Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:perf
        env:
          CI: true
